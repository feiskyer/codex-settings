# MiniMax: prefer MiniMax-M3.1-Flash; MiniMax-M3 remains available.
# Set MINIMAX_API_KEY and uncomment the desired entries.
# Global: https://api.minimax.io/v1; China: https://api.minimaxi.com/v1.
# In this LiteLLM template, Codex Responses requests bridge to MiniMax Chat Completions upstream.
# Flash always thinks; omit effort for its default (max), or use low/medium/high/xhigh/max.
# Do not send thinking.type=disabled, reasoning_effort=none, service_tier, or reasoning_split=false to Flash.
# Keep existing user-defined model aliases and legacy entries when updating a local config.
# - model_name: MiniMax-M3.1-Flash
#   model_info:
#     mode: chat
#     supports_reasoning: true
#     supports_vision: true
#     supports_video_input: true
#   litellm_params:
