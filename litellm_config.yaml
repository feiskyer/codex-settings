# Disable key per upstream bug https://github.com/BerriAI/litellm/issues/19773.
# general_settings:
  # master_key: sk-dummy
litellm_settings:
  drop_params: true
  modify_params: true
model_list:
- model_name: gpt-5.4
  model_info:
    mode: responses
    supports_vision: true
  litellm_params:
    model: github_copilot/gpt-5.4
    drop_params: true
    extra_headers:
      editor-version: "vscode/1.95.0"
      editor-plugin-version: "copilot-chat/0.26.7"
- model_name: gpt-5.3-codex
  model_info:
    mode: responses
    supports_vision: true
  litellm_params:
    model: github_copilot/gpt-5.3-codex
    drop_params: true
    extra_headers:
      editor-version: "vscode/1.95.0"
      editor-plugin-version: "copilot-chat/0.26.7"
- model_name: gpt-5.2-codex
  model_info:
    mode: responses
    supports_vision: true
  litellm_params:
    model: github_copilot/gpt-5.2-codex
    drop_params: true
    extra_headers:
      editor-version: "vscode/1.95.0"
      editor-plugin-version: "copilot-chat/0.26.7"
- model_name: claude-opus-4.6
  litellm_params:
    model: github_copilot/claude-opus-4.6
    drop_params: true
    extra_headers:
      editor-version: "vscode/1.95.0"
      editor-plugin-version: "copilot-chat/0.26.7"
- model_name: claude-opus-4.6-fast
  litellm_params:
    model: github_copilot/claude-opus-4.6-fast
    drop_params: true
    extra_headers:
      editor-version: "vscode/1.95.0"
      editor-plugin-version: "copilot-chat/0.26.7"
- model_name: "*"
  litellm_params:
    model: "github_copilot/*"
    drop_params: true
    extra_headers:
      editor-version: "vscode/1.95.0"
      editor-plugin-version: "copilot-chat/0.26.7"

